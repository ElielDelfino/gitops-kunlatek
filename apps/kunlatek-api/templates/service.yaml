apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-stable
  namespace: {{ .Values.app.namespace }}
spec:
  selector:
    app: {{ .Values.app.name }}
  ports:
    - port: 80
      targetPort: {{ .Values.app.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-canary
  namespace: {{ .Values.app.namespace }}
spec:
  selector:
    app: {{ .Values.app.name }}
  ports:
    - port: 80
      targetPort: {{ .Values.app.port }}
